# =========================================================================
# nginx config cho VoxDub control server — voxdub-api.duckdns.org
#
# Cách dùng trên VPS Windows:
#   1. Chép file này vào  C:\nginx\conf\voxdub-api.conf
#   2. Trong C:\nginx\conf\nginx.conf, bên trong khối  http { ... }  thêm:
#          include voxdub-api.conf;
#      (và XÓA/comment server block cũ của voxdub-api.duckdns.org nếu có,
#       để không bị trùng server_name)
#   3. Sửa 2 dòng ssl_certificate* bên dưới cho đúng đường dẫn cert
#      win-acme đã tạo trên máy bạn (xem hướng dẫn kèm theo).
#   4. Kiểm tra rồi nạp lại:
#          cd C:\nginx
#          nginx -t
#          nginx -s reload
# =========================================================================

# --- Cổng 80: chỉ phục vụ ACME (gia hạn cert) và đẩy sang HTTPS ----------
server {
    listen 80;
    server_name voxdub-api.duckdns.org;

    # win-acme gia hạn cert qua HTTP-01 — đường này phải đi lọt, không redirect.
    # Sửa alias nếu win-acme của bạn dùng thư mục khác.
    location /.well-known/acme-challenge/ {
        alias C:/nginx/acme/.well-known/acme-challenge/;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Cổng 443: TLS + proxy về Node trên 127.0.0.1:3001 -------------------
server {
    listen 443 ssl;
    http2 on;
    server_name voxdub-api.duckdns.org;

    # >>> SỬA 2 DÒNG NÀY theo đường dẫn cert thật của win-acme trên VPS <<<
    # (win-acme xuất .pem vào thư mục bạn đã chọn lúc tạo cert; ví dụ:)
    ssl_certificate      C:/nginx/certs/voxdub-api.duckdns.org-chain.pem;
    ssl_certificate_key  C:/nginx/certs/voxdub-api.duckdns.org-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1h;

    # Server này chỉ trả JSON bé xíu — chặn body to từ ngoài rìa.
    client_max_body_size 8k;

    # Không cho lộ version nginx
    server_tokens off;

    # HSTS: trình duyệt/HTTP client luôn dùng HTTPS cho domain này
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # Node cần IP thật của client để rate-limit / ban IP đúng người
        # (server.js đọc X-Forwarded-For khi TRUST_PROXY=1)
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        # API trả lời trong tích tắc — treo quá 10s là backend chết,
        # trả lỗi sớm cho client thay vì để app chờ.
        proxy_connect_timeout 5s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;

        # Backend sập thì trả 502 JSON gọn (app VoxDub fail-open nên vẫn chạy)
        proxy_intercept_errors on;
        error_page 502 503 504 = @backend_down;
    }

    location @backend_down {
        default_type application/json;
        return 502 '{"error":"backend down"}';
    }
}
